[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "GreasyPidgin"
version = "0.9.2"
description = "Algorithmic composition toolkit inspired by slippery chicken"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" } 
authors = [
  { name = "Sem Ribeiro Albuquerque Wendt", email = "sem@16161d.net" }
]

dependencies = [
  "numpy",
  "matplotlib",
  "mido",
  "python-osc",
]

[project.optional-dependencies]
xml = ["music21"]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]

[project.urls]
Homepage = "https://github.com/sem-16161d/GreasyPidgin"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]